function vSession(){
  const s=S.sess; if(!s) return vHome();
  const it=s.q[s.i],e=it.e,n=s.q.length;
  let h=`<div class="topbar"><button class="iconbtn" data-act="quit" aria-label="Salir de la práctica">✕</button><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${s.i}"><i style="width:${Math.round(100*(s.i+(s.phase==="fb"?1:0))/n)}%"></i></div><span class="small muted" style="font-variant-numeric:tabular-nums">${s.i+1}/${n}</span></div><div class="page q">`;
  if(it.type.startsWith("r_")) return h+refBody(s,it,e,n)+"</div>";
  const kinds={order:"Ordena la frase en euskera",es2eu:"Traduce al euskera",eu2es:"Traduce al castellano"};
  h+=`<div class="kind">${kinds[it.type]} · lección ${e.n}${e.src==="extra"?" · extra":""}</div>`;
  const prompt=it.type==="eu2es"?e.eu:e.es;
  h+=`<div class="prompt" lang="${it.type==="eu2es"?"eu":"es"}">${esc(prompt)}</div>`;
  if(e.hints&&e.hints.length&&s.phase==="ask") h+=s.hint?`<div class="hint"><b>Pistas:</b> ${e.hints.map(esc).join(" · ")}</div>`:`<button class="btn sec" data-act="hint" style="align-self:flex-start;min-height:40px">Ver pistas</button>`;
  if(s.phase==="ask"){
    if(it.type==="order") h+=orderUI(s);
    else {
      h+=`<textarea id="ans" class="field" rows="2" lang="${it.type==="es2eu"?"eu":"es"}" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Tu respuesta" placeholder="Escribe tu respuesta"></textarea>`;
      h+=`<div class="row">${it.type==="es2eu"?'<button class="btn sec" data-act="enye" style="flex:0 0 56px" aria-label="Insertar ñ">ñ</button>':""}<button class="btn sec" data-act="idk">No lo sé</button><button class="btn" data-act="check">Comprobar</button></div>`;
    }
  } else {
    const f=s.fb;
    const tit={ok:"¡Correcto!",near:"Casi: revisa los detalles",bad:"No es correcto"}[f.grade];
    const icon={ok:"✓",near:"≈",bad:"✗"}[f.grade];
    h+=`<div class="fb ${f.grade}" role="status"><h3><span aria-hidden="true">${icon}</span>${f.idk?"Esta es la respuesta":tit}</h3>`;
    if(!f.idk&&f.grade!=="ok"&&f.userHtml) h+=`<div class="ans"><small>Tu respuesta</small><div>${f.userHtml||"—"}</div></div>`;
    h+=`<div class="ans"><small>${it.type==="eu2es"?"En castellano":"En euskera"}</small><div>${f.grade==="ok"||!f.targetHtml?esc(f.target):f.targetHtml}</div></div>`;
    if(it.type==="order") h+=`<div class="ans"><small>Significa</small><div>${esc(e.es)}</div></div>`;
    if(it.type==="es2eu"&&f.grade!=="ok") h+=`<div class="ans"><small>Significa</small><div>${esc(e.es)}</div></div>`;
    if(it.type==="eu2es") h+=`<div class="ans"><small>Frase original</small><div>${esc(e.eu)}</div></div>`;
    h+=`</div>`;
    h+=`<div class="stack">${f.grade!=="ok"?'<button class="btn sec block" data-act="override">Mi respuesta también es válida</button>':""}<button class="btn block" data-act="next">${s.i+1<n?"Siguiente":"Ver resultado"}</button></div>`;
  }
  return h+"</div>";
}
function finishCheck(s,e,type,grade,user,target,userHtml,targetHtml,idk){
  const snap=record(e.id,grade==="ok");
  s.res.push({id:e.id,ok:grade==="ok",type,user,snap});
  s.fb={grade,target,userHtml,targetHtml,idk:!!idk}; s.phase="fb"; render();
  const nb=document.querySelector('[data-act="next"]'); if(nb) nb.focus();
}
function doCheckRef(idk,s,it,e){
  const t=it.type; let grade="bad",user="",userHtml="",targetHtml="",target=ansText(e);
  if(t==="r_mcq"||t==="r_tf"){
    if(s.sel!=null){ const o=s.opts[s.sel]; user=o.t; grade=(t==="r_mcq"?o.i===e.a:o.i===(e.a?1:0))?"ok":"bad"; userHtml=esc(user); }
  } else if(t==="r_fill"){
    const el=document.getElementById("ans"); user=el?el.value:"";
    let best="bad"; [e.a].concat(e.alt||[]).forEach(a=>{const g=gradeEu(user,a); if(g==="ok") best="ok"; else if(g==="near"&&best!=="ok") best="near";});
    grade=best; if(grade!=="ok"){ const d=diffWords(user,e.a); userHtml=d.user; targetHtml=d.target; }
  } else {
    user=s.chosen.map(x=>x.t).join(" "); grade=norm(user)===norm(e.a)?"ok":"bad";
    if(grade!=="ok"){ const d=diffWords(user,e.a); userHtml=d.user; targetHtml=d.target; }
  }
  if(idk){ grade="bad"; userHtml=""; user=""; }
  finishCheck(s,e,t,grade,user,target,userHtml,targetHtml,idk);
}
function doCheck(idk){
  const s=S.sess,it=s.q[s.i],e=it.e;
  if(it.type.startsWith("r_")) return doCheckRef(idk,s,it,e);
  let grade="bad",user="",target=it.type==="eu2es"?e.es:e.eu,userHtml="",targetHtml="";
  if(it.type==="order"){ user=s.chosen.map(x=>x.t).join(" "); }
  else { const el=document.getElementById("ans"); user=el?el.value:""; }
  if(!idk){
    if(it.type==="eu2es") grade=gradeEs(user,e.es); else grade=gradeEu(user,e.eu);
    if(it.type==="order") grade=norm(user)===norm(e.eu)?"ok":"bad";
    if(grade!=="ok"){ if(it.type==="eu2es"){ userHtml=esc(user); } else { const d=diffWords(user,e.eu); userHtml=d.user; targetHtml=d.target; } }
  }
  finishCheck(s,e,it.type,grade,user,target,userHtml,targetHtml,idk);
}
function failHTML(e,user){
  const u=user?`<div class="small">Tú: <span class="w-bad">${esc(user)}</span></div>`:"";
  if(e.k){ const q=e.k==="order"?e.a:String(e.q).replace(/_{3,}/g,"…"); return `<div class="eu">${esc(q)}</div><div class="muted">Respuesta: ${esc(ansText(e))}</div>${u}`; }
  return `<div class="eu">${esc(e.eu)}</div><div class="muted">${esc(e.es)}</div>${u}`;
}
function vResults(){
  const s=S.sess; const ok=s.res.filter(r=>r.ok).length,n=s.res.length; const fails=s.res.filter(r=>!r.ok);
  let h=`<div class="topbar"><h1>Resultado</h1></div><div class="page"><div class="card"><div class="score">${ok}/${n}</div><p class="muted" style="margin:6px 0 0">${esc(s.title)}</p></div>`;
  if(fails.length){
    h+=`<section class="stack"><h2 style="font-size:1.2rem">Tus fallos</h2><ul class="fail-list">`+fails.map(r=>`<li>${failHTML(ITEM[r.id],r.user)}</li>`).join("")+`</ul></section>`;
    h+=`<div class="stack"><button class="btn block" data-act="retry">Repasar estos fallos ahora</button><button class="btn sec block" data-act="done">Volver</button></div>`;
  } else h+=`<p>${n?"Todo correcto. Los ejercicios que aciertes dos veces seguidas pasan a «dominados».":"No hay respuestas en esta sesión."}</p><button class="btn block" data-act="done">Volver</button>`;
  return h+"</div>";
}
function vReview(){
  const ids=allFails(); let h=`<div class="topbar"><h1>Repaso de fallos</h1></div><div class="page">`;
  if(!ids.length) return h+`<div class="card"><b>No tienes fallos pendientes.</b><p class="muted" style="margin:6px 0 0">Los ejercicios que falles (del curso o del refuerzo) aparecerán aquí hasta que los aciertes dos veces seguidas.</p></div></div>`;
  h+=`<button class="btn block" data-act="startall">Repasar ${Math.min(10,ids.length)} fallos (de ${ids.length})</button>`;
  const g={}; ids.forEach(id=>{const e=ITEM[id],k=e.b?"b:"+e.b:"l:"+e.n;(g[k]=g[k]||[]).push(e);});
  const ord=k=>k[0]==="l"?+k.slice(2):100+BLOCKS.indexOf(RB[k.slice(2)]);
  Object.keys(g).sort((a,b)=>ord(a)-ord(b)).forEach(k=>{
    const head=k[0]==="l"?`${k.slice(2)}. ${esc(BYN[k.slice(2)].title)}`:`<span class="chip" data-l="${RB[k.slice(2)].lvl}">${RB[k.slice(2)].lvl}</span> ${esc(blkLabel(RB[k.slice(2)]))}`;
    h+=`<section class="stack"><h2 style="font-size:1.05rem">${head}</h2><ul class="fail-list">`+g[k].map(e=>`<li>${failHTML(e)}<button class="btn sec" data-act="dismiss" data-id="${e.id}" style="min-height:36px;padding:6px 12px;margin-top:6px;font-size:.85rem">Quitar de fallos</button></li>`).join("")+`</ul></section>`;
  });
  return h+"</div>";
}
function vSearch(){
  let h=`<div class="topbar"><h1>Buscar</h1></div><div class="page"><div class="search"><input id="q" class="field" type="search" value="${esc(S.q)}" placeholder="Busca en la teoría y los ejemplos" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Buscar"></div><div id="results" class="stack"></div></div>`;
  return h;
}
function doSearch(){
  const q=norm(S.q); const box=document.getElementById("results"); if(!box) return;
  if(q.length<2){ box.innerHTML='<p class="muted">Escribe al menos dos letras. Funciona sin acentos ni mayúsculas.</p>'; return; }
  const out=[];
  for(const l of LES){
    for(const b of l.blocks){
      const txt=b.t==="p"?b.x:b.rows.map(r=>r.join(" · ")).join(" | ");
      const nt=norm(txt); const k=nt.indexOf(q); if(k<0) continue;
      let at=txt.toLowerCase().indexOf(S.q.toLowerCase()); if(at<0) at=Math.max(0,Math.floor(k*txt.length/Math.max(1,nt.length)));
      const sn=txt.slice(Math.max(0,at-50),at+110);
      out.push({n:l.n,tx:(at>50?"…":"")+sn+(txt.length>at+110?"…":"")});
      if(out.length>=40) break;
    }
    if(out.length>=40) break;
  }
  box.innerHTML=out.length?out.map(r=>`<button class="res" data-act="lesson" data-n="${r.n}"><b>Lección ${r.n}</b> · ${esc(BYN[r.n].title)}<div class="muted small">${esc(r.tx)}</div></button>`).join(""):'<p class="muted">Sin resultados.</p>';
}
function vProgress(){
  const bookIds=Object.keys(ITEM).filter(id=>ITEM[id].src==="libro"),exIds=Object.keys(ITEM).filter(id=>ITEM[id].src==="extra");
  const refIds=Object.keys(ITEM).filter(id=>ITEM[id].src==="ref"&&!isHid(id));
  const d1=bookIds.filter(isDone).length,d2=exIds.filter(isDone).length,d3=refIds.filter(isDone).length;
  let c=0,w=0; Object.values(P.items).forEach(i=>{c+=i.c;w+=i.w;});
  const acc=c+w?Math.round(100*c/(c+w)):0;
  let h=`<div class="topbar"><h1>Progreso</h1></div><div class="page"><div class="stats"><div class="stat"><b>${d1}/${bookIds.length}</b><span>ejercicios del libro dominados</span></div><div class="stat"><b>${d2}/${exIds.length}</b><span>de práctica extra</span></div><div class="stat"><b>${d3}/${refIds.length}</b><span>de refuerzo dominados</span></div><div class="stat"><b>${acc}%</b><span>de aciertos (${c+w} respuestas)</span></div></div>`;
  h+=`<section class="stack"><h2 style="font-size:1.1rem">Por lección</h2><ul class="lessons">`+LES.filter(l=>l.ex.length||(l.extra&&l.extra.length)).map(l=>{const st=lessonStats(l);const pc=st.tot?Math.round(100*st.done/st.tot):0;return `<li><button class="lrow" data-act="lesson" data-n="${l.n}"><span class="num">${l.n}</span><span class="tt"><strong>${st.done}/${st.tot} dominados</strong><div class="bar"><i style="width:${pc}%"></i></div></span><span class="chev">›</span></button></li>`;}).join("")+`</ul></section>`;
  h+=`<section class="stack"><h2 style="font-size:1.1rem">Refuerzo por bloque</h2><ul class="lessons">`+BLOCKS.map(b=>{const st=blockStats(b),pc=st.tot?Math.round(100*st.done/st.tot):0;return `<li><button class="lrow" data-act="refblock" data-id="${b.id}"><span class="chip" data-l="${b.lvl}">${b.lvl}</span><span class="tt"><strong>Bloque ${b.n} · ${st.done}/${st.tot} dominados</strong><div class="bar"><i style="width:${pc}%"></i></div></span><span class="chev">›</span></button></li>`;}).join("")+`</ul></section>`;
  const nh=Object.keys(P.hid||{}).length;
  if(nh) h+=`<section class="card stack"><h2 style="font-size:1.1rem">Ejercicios ocultos</h2><p class="muted small" style="margin:0">Has ocultado ${nh} ejercicio${nh>1?"s":""} del refuerzo por tener errores.</p><button class="btn sec" data-act="unhide">Mostrarlos otra vez</button></section>`;
  h+=`<section class="card stack"><h2 style="font-size:1.1rem">Apariencia</h2><div class="seg" role="group" aria-label="Tema">${[["auto","Automático"],["light","Claro"],["dark","Oscuro"]].map(([k,l])=>`<button data-act="theme" data-k="${k}" aria-pressed="${P.theme===k}">${l}</button>`).join("")}</div><div class="seg" role="group" aria-label="Tamaño del texto"><button data-act="fs" data-d="-0.1" aria-label="Texto más pequeño">A−</button><button data-act="fs" data-d="0.1" aria-label="Texto más grande">A+</button></div></section>`;
  h+=`<section class="card stack"><h2 style="font-size:1.1rem">Copia de seguridad</h2><p class="muted small" style="margin:0">Tu progreso se guarda en este dispositivo. Si borras los datos del navegador se pierde: copia el texto de abajo para guardarlo o para pasarlo a otro móvil.</p><button class="btn sec" data-act="backup">${S.backup?"Ocultar":"Mostrar"} copia de seguridad</button>`;
  if(S.backup) h+=`<textarea id="bk" class="field" aria-label="Copia de seguridad">${esc(JSON.stringify(P))}</textarea><div class="row"><button class="btn" data-act="copybk">Copiar</button><button class="btn sec" data-act="importbk">Importar lo pegado</button></div><p id="bkmsg" class="small muted" role="status" style="margin:0"></p>`;
  h+=`</section><section class="card stack"><h2 style="font-size:1.1rem">Empezar de cero</h2>${S.confirmReset?'<p style="margin:0">Se borrarán todos tus aciertos y fallos. No se puede deshacer.</p><div class="row"><button class="btn danger" data-act="reset2">Sí, borrar todo</button><button class="btn sec" data-act="reset0">Cancelar</button></div>':'<button class="btn sec" data-act="reset1">Borrar mi progreso</button>'}</section></div>`;
  return h;
}

function render(){
  const v=S.view; let h="";
  if(v==="home") h=vHome(); else if(v==="lesson") h=vLesson(); else if(v==="session") h=vSession(); else if(v==="results") h=vResults();
  else if(v==="review") h=vReview(); else if(v==="search") h=vSearch(); else if(v==="progress") h=vProgress();
  else if(v==="ref") h=vRef(); else if(v==="refblock") h=vRefBlock();
  if(S.viewer) h+=vPages();
  $app.innerHTML=h; renderNav();
  if(v==="search"){ doSearch(); }
  if(v==="session"&&S.sess&&S.sess.phase==="ask"){ const a=document.getElementById("ans"); if(a&&!S.sess._nf) a.focus({preventScroll:true}); }
}

/* ---------- eventos ---------- */
$app.addEventListener("input",e=>{ if(e.target.id==="q"){ S.q=e.target.value; doSearch(); } });
$app.addEventListener("keydown",e=>{
  if(e.target.id==="ans"&&e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); doCheck(false); }
  else if(S.view==="session"&&S.sess&&S.sess.phase==="fb"&&e.key==="Enter"&&e.target.tagName!=="BUTTON"){ document.querySelector('[data-act="next"]')?.click(); }
});
function onAct(ev){
  const b=ev.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act,s=S.sess;
  switch(a){
    case "nav": S.sess=null; S.viewer=null; go(b.dataset.v,{q:S.q}); break;
    case "lesson": go("lesson",{n:+b.dataset.n,tab:(S.view==="search")?"teoria":(S.view==="progress"?"practica":"teoria")}); break;
    case "back": history.length>1?history.back():go("home"); break;
    case "tab": S.tab=b.dataset.t; try{history.replaceState({v:"lesson",n:S.n,tab:S.tab},"");}catch(e){} render(); window.scrollTo(0,0); break;
    case "pages": S.viewer=true; try{history.pushState({v:"viewer"},"");}catch(e){} render(); break;
    case "closepages": if(history.state&&history.state.v==="viewer") history.back(); else {S.viewer=null; render();} break;
    case "start": { const k=b.dataset.k; const items=pickItems(k,S.n); if(items.length) startSession(items,{libro:"Ejercicios del libro",extra:"Práctica extra",fails:"Repaso de fallos"}[k]+" · lección "+S.n,"lesson"); break; }
    case "startall": { const items=pickItems("all"); if(items.length) startSession(items,"Repaso de fallos","review"); break; }
    case "quit": S.sess=null; history.length>1?history.back():go("home"); break;
    case "hint": s.hint=true; { const v=document.getElementById("ans"); const txt=v?v.value:""; render(); const v2=document.getElementById("ans"); if(v2){v2.value=txt;} } break;
    case "enye": { const el=document.getElementById("ans"); if(el){ const p=el.selectionStart||el.value.length; el.value=el.value.slice(0,p)+"ñ"+el.value.slice(el.selectionEnd||p); el.focus(); el.setSelectionRange(p+1,p+1);} break; }
    case "place": { const x=s.bank[+b.dataset.k]; if(!x.used){x.used=true;s.chosen.push(x);render();} break; }
    case "unplace": { const x=s.chosen.splice(+b.dataset.k,1)[0]; if(x){x.used=false;render();} break; }
    case "check": doCheck(false); break;
    case "idk": doCheck(true); break;
    case "override": { const r=s.res[s.res.length-1]; if(r&&!r.ok){ P.items[r.id]=JSON.parse(r.snap); record(r.id,true); r.ok=true; r.user=""; s.fb.grade="ok"; saveP(); render(); } break; }
    case "next": if(s.i+1<s.q.length){ s.i++; prepQ(); render(); window.scrollTo(0,0);} else { go("results",null,false); } break;
    case "retry": { const items=s.res.filter(r=>!r.ok).map(r=>ITEM[r.id]); startSession(items,"Repaso de fallos",s.back); break; }
    case "done": { const back=s&&s.back; S.sess=null; if(back==="lesson") go("lesson",{tab:"practica"},false); else if(back==="review") go("review",null,false); else if(back==="refblock") go("refblock",{b:s.bid},false); else go("home",null,false); break; }
    case "refblock": go("refblock",{b:b.dataset.id}); break;
    case "rstart": { const k=b.dataset.k,id=S.b; const bl=RB[id];
      if(k==="block"){ const items=pickItems("rblock",id); if(items.length) startSession(items,"Refuerzo "+bl.lvl+" · Bloque "+bl.n,"refblock"); }
      else if(k==="fails"){ const items=pickItems("rfails",id); if(items.length) startSession(items,"Repaso de fallos · "+bl.lvl+" Bloque "+bl.n,"refblock"); }
      else { const items=pickItems("rex",id,+b.dataset.x); if(items.length) startSession(items,"Refuerzo "+bl.lvl+" · Bloque "+bl.n+" · ejercicio "+b.dataset.x,"refblock",true); }
      break; }
    case "pick": s.sel=+b.dataset.k; render(); { const o=document.querySelector('.opt[aria-checked="true"]'); if(o) o.focus({preventScroll:true}); } break;
    case "hide": { const e=s.q[s.i].e; P.hid[e.id]=1; delete P.items[e.id]; s.res.pop(); saveP(); if(s.i+1<s.q.length){ s.i++; prepQ(); render(); window.scrollTo(0,0);} else go("results",null,false); break; }
    case "unhide": P.hid={}; saveP(); render(); break;
    case "dismiss": delete P.items[b.dataset.id].f; saveP(); render(); break;
    case "theme": P.theme=b.dataset.k; saveP(); applyPrefs(); render(); break;
    case "fs": P.fs=Math.min(1.5,Math.max(.8,Math.round((P.fs+ +b.dataset.d)*10)/10)); saveP(); applyPrefs(); break;
    case "backup": S.backup=!S.backup; render(); break;
    case "copybk": { const t=document.getElementById("bk"); t.select(); let ok=false; try{ navigator.clipboard.writeText(t.value).then(()=>{document.getElementById("bkmsg").textContent="Copiado.";},()=>{document.getElementById("bkmsg").textContent="Selecciona el texto y cópialo a mano.";}); ok=true;}catch(e){} if(!ok) document.getElementById("bkmsg").textContent="Selecciona el texto y cópialo a mano."; break; }
    case "importbk": { const t=document.getElementById("bk"); try{ const o=JSON.parse(t.value); if(!o||typeof o.items!=="object") throw 0; Object.assign(P,o); saveP(); applyPrefs(); document.getElementById("bkmsg").textContent="Progreso importado."; renderNav(); }catch(e){ document.getElementById("bkmsg").textContent="El texto no es una copia válida."; } break; }
    case "reset1": S.confirmReset=true; render(); break;
    case "reset0": S.confirmReset=false; render(); break;
    case "reset2": P.items={}; P.hid={}; P.last=null; saveP(); S.confirmReset=false; render(); break;
  }
}
document.addEventListener("click",onAct);
try{ history.replaceState({v:"home",n:null,tab:"teoria",b:null},""); }catch(e){}
render();
try{ if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){}
window.__euskera={norm,gradeEu,gradeEs,variants,diffWords,P,S,RB,STOPS,ITEM,BLOCKS};
})();
</script>

</body></html>
