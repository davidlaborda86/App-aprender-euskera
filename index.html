<title>Euskara Plazara</title>

<style>
/* Concepto: una columna de lectura (móvil primero) con barra inferior de 4 secciones.
   Teoría = texto limpio con tablas del libro; práctica = tarjetas de una pregunta cada vez. */
:root{
  --bg:#F3F6F1; --surface:#FFFFFF; --surface2:#EAF0E8; --ink:#13231B; --muted:#586A5F; --line:#D8E1D6;
  --brand:#1E5A41; --brand-ink:#FFFFFF; --brand-soft:#DCEBE1;
  --accent:#B3272D;
  --ok:#17794C; --ok-soft:#DDF0E5; --bad:#B93A2A; --bad-soft:#F8E1DC; --warn:#8A5A00; --warn-soft:#F7ECCF;
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --fsm:1; --nav-h:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1612; --surface:#15231C; --surface2:#1B2D24; --ink:#E7F0EA; --muted:#98ACA0; --line:#274034; --brand:#6FD0A0; --brand-ink:#06150D; --brand-soft:#1D3B2E;
    --accent:#FF7E7A;
    --ok:#6FD0A0; --ok-soft:#173A2A; --bad:#FF8F80; --bad-soft:#40201C; --warn:#E9B955; --warn-soft:#3B2E10;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1612; --surface:#15231C; --surface2:#1B2D24; --ink:#E7F0EA; --muted:#98ACA0; --line:#274034;
  --brand:#6FD0A0; --brand-ink:#06150D; --brand-soft:#1D3B2E;
  --accent:#FF7E7A;
  --ok:#6FD0A0; --ok-soft:#173A2A; --bad:#FF8F80; --bad-soft:#40201C; --warn:#E9B955; --warn-soft:#3B2E10;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:calc(17px*var(--fsm));line-height:1.5;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px));margin:0;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
#app{max-width:720px;margin-inline:auto;min-width:0}
h1,h2,h3{font-family:var(--font-display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;
  padding-block:12px;min-height:56px;border-bottom:1px solid var(--line);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.topbar h1{font-size:1.25rem;flex:1;min-width:0}
.topbar .sub{color:var(--muted);font-size:.85rem}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.page{padding-block:20px;display:flex;flex-direction:column;gap:20px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px}
.brand b{font-family:var(--font-display);font-size:1.5rem;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:.9rem}
/* continuar */
.resume{display:flex;gap:14px;align-items:center;background:var(--brand);color:var(--brand-ink);border:0;border-radius:18px;padding:16px 18px;text-align:left;width:100%}
.resume .big{font-family:var(--font-display);font-size:2.4rem;font-weight:700;line-height:1;min-width:2ch}
.resume .t{display:flex;flex-direction:column;min-width:0}
.resume .t small{opacity:.8}
.resume .t strong{font-size:1.05rem;overflow-wrap:anywhere}
.group h2{font-size:.8rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-family:var(--font-body);font-weight:700;margin-bottom:8px}
.lessons{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.lrow{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:64px}
.lrow .num{font-family:var(--font-display);font-weight:700;font-size:1.6rem;color:var(--brand);min-width:2ch;text-align:right}
.lrow .tt{min-width:0}
.lrow .tt strong{display:block;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.lrow .tt small{color:var(--muted)}
.bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.chev{color:var(--muted);font-size:1.3rem}
/* nav */
.nav{position:fixed;inset:auto 0 0 0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-in{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:100%;max-width:720px}
.nav button{background:none;border:0;border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;color:var(--muted);font-size:.72rem;font-weight:600;position:relative}
.nav button[aria-current="page"]{color:var(--brand);background:var(--brand-soft)}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:99px;font-size:.7rem;min-width:18px;height:18px;padding:0 5px;display:flex;align-items:center;justify-content:center}
/* tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface2);padding:4px;border-radius:14px}
.tabs button{border:0;background:none;border-radius:10px;padding:10px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
/* teoría */
.theory{display:flex;flex-direction:column;gap:14px}
.theory p{margin:0;max-width:65ch;overflow-wrap:anywhere}
.sf{color:var(--accent);font-weight:700}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:8px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--brand-soft);color:var(--ink);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
td.sec{background:var(--surface2);font-weight:700}
td{min-width:7ch}
/* botones */
.btn{border:0;background:var(--brand);color:var(--brand-ink);border-radius:14px;padding:13px 18px;font-weight:700;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:none;color:var(--brand);border:1px solid var(--brand)}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-family:var(--font-display);font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.85rem}
/* sesión */
.sess-top{display:flex;align-items:center;gap:12px}
.progress{flex:1;height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand);transition:width .25s}
.q{display:flex;flex-direction:column;gap:14px}
.q .kind{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.q .prompt{font-family:var(--font-display);font-size:1.5rem;line-height:1.25;overflow-wrap:anywhere;font-weight:500}
.hint{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:.92rem}
.field{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:1.05rem;min-height:56px;resize:none}
.field:focus{border-color:var(--brand);outline:none}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;min-height:44px;font-size:1.05rem;box-shadow:0 2px 0 var(--line)}
.tile.used{visibility:hidden}
.slot{min-height:64px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;background:var(--surface)}
.slot .tile{background:var(--brand-soft);border-color:var(--brand)}
.fb{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.fb.ok{background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.fb.near{background:var(--warn-soft)}
.fb h3{font-size:1.15rem;display:flex;gap:8px;align-items:center}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)} .fb.near h3{color:var(--warn)}
.ans{display:flex;flex-direction:column;gap:2px}
.ans small{color:var(--muted);font-weight:600;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}
.ans div{overflow-wrap:anywhere;font-size:1.05rem}
.w-bad{color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
.w-miss{color:var(--ok);font-weight:700;text-decoration:underline}
.fail-list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.fail-list li{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:12px;padding:10px 12px;overflow-wrap:anywhere}
.fail-list .eu{font-weight:700}
.score{font-family:var(--font-display);font-size:3.4rem;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.search{display:flex;gap:8px}
.res{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;overflow-wrap:anywhere}
.res b{color:var(--brand)}
mark{background:var(--warn-soft);color:inherit;border-radius:3px;padding:0 1px}
/* visor de páginas */
.viewer{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.viewer header{position:sticky;top:0;background:var(--bg);display:flex;gap:10px;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);z-index:2}
.viewer header strong{flex:1}
.viewer img{display:block;width:100%;max-width:900px;margin:12px auto;background:#fff;border:1px solid var(--line)}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
textarea.field{min-height:96px;font-size:.8rem;font-family:ui-monospace,Menlo,monospace}
/* refuerzo-v2 */
.chip{display:inline-flex;align-items:center;font-weight:700;font-size:.75rem;letter-spacing:.05em;border-radius:99px;padding:2px 9px;background:var(--brand);color:var(--brand-ink);vertical-align:middle;white-space:nowrap}
.chip[data-l="A2"]{background:var(--warn);color:var(--brand-ink)}
.chip[data-l="B1"],.chip[data-l="B2"],.chip[data-l="C1"]{background:var(--ink);color:var(--bg)}
.chip.big{font-size:1.1rem;padding:6px 14px}
.lvlh{display:flex;align-items:center;gap:12px}
.passage{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--brand);border-radius:12px;padding:12px 14px;white-space:pre-line;overflow-wrap:anywhere;font-size:.98rem}
.passage strong{display:block;margin-bottom:2px}
.inst{color:var(--muted);font-size:.92rem;overflow-wrap:anywhere}
.gap{display:inline-block;min-width:2.6ch;border-bottom:3px solid var(--brand);margin:0 .15em;transform:translateY(2px)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;min-height:56px;font-size:1.05rem;font-weight:600;overflow-wrap:anywhere}
.opt>span:last-child{min-width:0}
.opt .mk{flex:0 0 28px;height:28px;border-radius:99px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;color:var(--muted)}
.opt[aria-checked="true"]{border-color:var(--brand);background:var(--brand-soft)}
.opt[aria-checked="true"] .mk{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.opt.good .mk{background:var(--ok);border-color:var(--ok);color:var(--brand-ink)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .mk{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default;opacity:1}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:10px;min-height:44px;font-size:.9rem}
.refrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--brand-soft);border:1.5px dashed var(--brand);border-radius:14px;padding:10px 14px;min-height:60px}
.refrow strong{display:block;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.refrow small{color:var(--muted)}
.ckpt{background:var(--brand-soft);border:1.5px solid var(--brand);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ckpt h2{font-size:1.15rem}
.ckpt .blk{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border-radius:12px;padding:10px 12px;border:1px solid var(--line)}
.ckpt .blk>div{flex:1 1 180px;min-width:0}
.ckpt .blk .btn{flex:1 1 150px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/*DATA*/
const COURSE = {"lessons":[{"n":1,"title":"Pronunciación, IZAN, afirmación","pages":[5,7],"blocks":[{"t":"p","x":"En ortografia, no existen ni acentos, ni diéresis, ni las siguientes letras: c, ñ, q, v, w, y. Támpoco se escriben las dos eles (ll)."},{"t":"p","x":"Se lee como se escribe, las letras son igual que en castellano, excepto para las siguientes;"},{"t":"table","rows":[["Euskara","Castellano","Ejemplo"],["tz, tx, ts","«ch». En realidad las tres suenan algo distinto, pero para empezar vale pronunciarlas como «ch»","gatza (sal), etxea (casa), itsasoa (mar)"],["z","«s». En realidad es sibilante, pero suena muy parecido a «s»","izan (ser)"],["j","Como la «j» castellana en Gipuzkoa y Nafarroa, y como «ll» en Bizkaia. Ambas pronunciaciones son correctas","joan (ir)"],["-il-","Como «-ill-» en castellano","makila (bastón)"],["vocal + i + vocal","Como «ll» en castellano","garraio (transporte), arratoia (rata)"],["in","Como «-iñ-» en castellano","mina (dolor)"]]},{"t":"p","x":"En euskara no es necesario indicar el sujeto de la frase. Los pronombres personales sujeto son:"},{"t":"table","rows":[["Ni","Yo"],["Zu","Tú"],["Hura","Él/ella"],["Gu","Nosotros/as"],["Zuek","Vosotros/as"],["Haiek","Ellos/as"]]},{"t":"p","x":"Como vemos, y podemos adelantarlo ya, el euskera no tiene género (masculino/femenino) ni para personas, ni para adjetivos, ni para sustantivos."},{"t":"p","x":"Empezaremos con el aditza (verbo) mas usado, que es el IZAN, en castellano se leería como \"isan\", y significa SER;"},{"t":"table","rows":[["IZAN (ser)","",""],["NOR","ADITZA","TRADUCCION"],["ni","NAIZ","yo soy"],["zu","ZARA","tú erés"],["hura","DA","él/ella es"],["gu","GARA","nosotros/as somos"],["zuek","ZARETE","vosotros/as sois"],["haiek","DIRA","ellos/as son"]]},{"t":"p","x":"En euskera los verbos se ponen al final de la frase, unos ejemplos son:"},{"t":"table","rows":[["ni Gorka naiz","yo soy (me llamo) Gorka"],["zu ikaslea zara","tú erés estudiante"],["hura langilea da","él/ella es trabajador/a"],["gu Bilbokoak gara","nosotros/as somos de Bilbao"],["zuek bilbotarrak zarete","vosotros/as sois bilbainos/as"],["haiek ikasleak dira","ellos/as son estudiantes"],["haiek Pedro eta Marta dira","ellos son Pedro y Marta"],["Gorka naiz","soy Gorka"]]},{"t":"p","x":"Observamos que en plural se pone una \"k\" al final de la palabra ikaslea (estudiante), para crear plurales en euskara se añade siempre una \"k\"."},{"t":"p","x":"Ademas, si buscaramos esta palbra en el diccionario, encontraríamos ikasle, sin \"a\" al final, esta \"a\" es el artículo y simpre lo pondremos en sustantivos (en relidad hay casos en los que no se usa, pero para nuestro euskara coloquial de estudiante recién iniciado lo pondremos siempre sin que nadie nos diga nada)."},{"t":"p","x":"Para acabar esta 1ª lección, ya de por sí un poco densa, entraremos con algunas expresiones cotidianas:"},{"t":"table","rows":[["EUSKARA","CASTELLANO"],["Egun on!","Buenos días"],["Arratsalde on!","Buenas tardes"],["Gabon! / Gau on!","Buenas noches"],["Eskerrik asko!","Muchas gracias"],["Mila ezker!","Mil gracias"],["Ez horregaitik!","De nada"],["Agur!","Adios"],["Gero arte!","Hasta luego"],["Ikusi arte!","Hasta la vista"],["Bihar arte!","Haste mañana"],["Kaixo!","Hola"],["On egin!","Que aproveche"]]},{"t":"table","rows":[["Urte berri on!","Feliz año nuevo"],["Zer moduz?","¿qué tal?"],["ondo, eta zu?","bien, ¿y tú?"],["ni ere ondo.","yo también bien."]]}],"ex":[{"id":"L1-1","eu":"Kaixo, ni Miguel naiz","es":"Hola, yo soy Miguel","hints":[]},{"id":"L1-2","eu":"Zu David zara","es":"Tú eres David","hints":[]},{"id":"L1-3","eu":"Hura Natalia da","es":"Ella es Natalia","hints":[]},{"id":"L1-4","eu":"Gu Gazteizkoak gara","es":"Nosotros somos de Gazteiz","hints":[]},{"id":"L1-5","eu":"Zuek Iruñeakoak zarete","es":"Vosotr@s sois de Iruñea","hints":[]},{"id":"L1-6","eu":"Haiek Tuterakoak dira","es":"Ell@s son de Tutera","hints":["de Tudela"]},{"id":"L1-7","eu":"Hura maisua da","es":"El/Ella es profesor/a","hints":["profesor/a"]},{"id":"L1-8","eu":"Zu medikua zara","es":"Tú eres medico","hints":["médico"]}],"extra":[{"id":"X1-1","eu":"Egun on!","es":"Buenos días","hints":[]},{"id":"X1-2","eu":"Arratsalde on!","es":"Buenas tardes","hints":[]},{"id":"X1-3","eu":"Gabon! / Gau on!","es":"Buenas noches","hints":[]},{"id":"X1-4","eu":"Eskerrik asko!","es":"Muchas gracias","hints":[]},{"id":"X1-5","eu":"Mila ezker!","es":"Mil gracias","hints":[]},{"id":"X1-6","eu":"Ez horregaitik!","es":"De nada","hints":[]},{"id":"X1-7","eu":"Agur!","es":"Adios","hints":[]},{"id":"X1-8","eu":"Gero arte!","es":"Hasta luego","hints":[]},{"id":"X1-9","eu":"Ikusi arte!","es":"Hasta la vista","hints":[]},{"id":"X1-10","eu":"Bihar arte!","es":"Haste mañana","hints":[]},{"id":"X1-11","eu":"Kaixo!","es":"Hola","hints":[]},{"id":"X1-12","eu":"On egin!","es":"Que aproveche","hints":[]},{"id":"X1-13","eu":"Urte berri on!","es":"Feliz año nuevo","hints":[]},{"id":"X1-14","eu":"Zer moduz?","es":"¿qué tal?","hints":[]},{"id":"X1-15","eu":"ondo, eta zu?","es":"bien, ¿y tú?","hints":[]},{"id":"X1-16","eu":"ni ere ondo.","es":"yo también bien.","hints":[]}]},{"n":2,"title":"Pregunta, negación, nongoa (-koa)","pages":[7,9],"blocks":[{"t":"p","x":"En euskara las oraciones interrogativas se construyen según el esquema:"},{"t":"p","x":"GALDEGAIA+VERBO+SUJETO+\"?\""},{"t":"p","x":"El sujeto no es obligatorio."},{"t":"p","x":"Galdegaia es la palabra que nos indica el tipo de pregunta que hacemos, o nos hacen, por ejemplo, NOR significa \"quien\", NORTZUK significa \"quienes\", NON significa \"donde\", NONGOA \"de donde\" si es una persona, NONGOAK \"de donde\" cuando preguntamos por varias personas....Así decimos:"},{"t":"table","rows":[["EUSKARA","CASTELLANO"],["Nor zara zu?","¿Quien erés tú?"],["Nor da hura?","¿Quien es él/ella?"],["Nortzuk dira haiek?","¿Quienes son ellos/as?"],["Nortzuk zarete zuek?","¿Quienes sois vosotros/as?"],["Nor da?","¿Quien es?"]]},{"t":"p","x":"Para preguntas que se contestan con un sí o un no, las interrogativas se construyen como afirmativas, por ejemplo;"},{"t":"table","rows":[["EUSKARA","CASTELLANO","RESPUESTAS POSIBLES"],["Zu Pablo zara?","¿tú erés Pablo?","-Bai, ni Pablo naiz (si, yo soy Pablo)\n- Ez, ni ez naiz Pablo, ni Alberto naiz (no,\nyo no soy Pablo, yo soy Alberto)"],["Marta Bianakoa da?","¿Marta es de Viana?","-Bai, Marta Bianakoa da.\n- Ez, Marta ez da Bianakoa, Marta\nLodosakoa da."],["Zuek Labastidakoak\nzarete?","¿vosotros/as sois de\nLabastida?","-Bai, gu Labastidakoak gara.\n-Ez, gu ez gara Labastidakoak, gu\nOiongoak gara."]]},{"t":"p","x":"En la última respuesta, para decir que somos de Oyón, como Oion acaba en \"n\" no ponemos la terminacion (atzizki) “-koak”, sino “-goak”, que significa lo mismo pero se pone cuando el lugar acaba en -n. Así para decir que somos de IruN, decimos \"gu IruNgoak gara\", de Larraun, \"Larraungoak\",..."},{"t":"p","x":"Las oraciones negativas se construyen según el esquema siguiente;"},{"t":"p","x":"SUJETO+EZ+VERBO+......."},{"t":"p","x":"El sujeto tampoco aquí es obligatorio."},{"t":"table","rows":[["EUSKARA","CASTELLANO"],["Ez naiz arrantzalea, ni okina naiz","No soy pescador, yo soy panadero/a."],["Hura ez da garraiolaria, hura\ndendaria da","El/ella no es transportista, el/ella es tendero/a"],["Ni ez naiz Natalia, ni Nuria naiz","Yo no soy Natalia, yo soy Nuria"]]},{"t":"p","x":"Hemos visto algunos oficios, por lo que aprovechamos para, acabando esta lección, como se construyen las palabras para los oficios,"},{"t":"p","x":"En euskara, \"denda\" significa tienda, añadiendo el atzizki (sufijo) -ari tenemos \"dendari\" (tendero); también sabemos que \"taberna\" significa bar, así que añadiendo de nuevo -ari tenemos \"tabernari\" (tabernero, o barman); de \"kanta\" (cantar) tenemos \"kantari\"."},{"t":"p","x":"En otros casos \"garraio\" (transporte), que en castellano se pronuncia \"garrallo\", ponemos -lari hacienos \"garraiolari\" (transportista)."},{"t":"p","x":"Lo que hemos visto es la regla general para oficios, pero hay excepciones, como de \"arrantza\" (pesca) hacer \"arrantzale\" (pescador), esto ya se explicará más adelante (aunque diremos ahora que la terminación -zale significa \"aficionado a\", o \"que le gusta el/la\" pesca)."}],"ex":[{"id":"L2-1","eu":"Egun on!, ni Gonzalo naiz, eta zu?","es":"¡Buenos días!, yo soy Gonzalo, y tú?","hints":[]},{"id":"L2-2","eu":"Kaixo, ni Laura naiz, eta Iruñakoa naiz, eta zu, nongoa zara zu?","es":"Hola, yo soy Laura, y soy de Iruñea, u tú, ¿de dónde eres tú?","hints":[]},{"id":"L2-3","eu":"ni Barakaldokoa naiz, agur Laura!","es":"Yo soy de Barakaldo, ¡adiós Laura!","hints":[]},{"id":"L2-4","eu":"Agur Gonzalo!","es":"Adios Gonzalo","hints":[]},{"id":"L2-5","eu":"Arratsalde on! ni David naiz, eta zuek, nortzuk zarete?","es":"¡Buenas tardes! Yo soy David, y vosotros, ¿Quiénes sois?","hints":[]},{"id":"L2-6","eu":"Arratsalde on, gu Almudena eta Ana gara, eta Burlatakoak gara, eta zu, nongoa zara zu?","es":"Buenas tardes, nosotras somos Almudena y Ana, y somos de Burlada, y tú, ¿de dónde eres tú?","hints":[]},{"id":"L2-7","eu":"ni Tafallakoa naiz.","es":"Yo soy de Tafalla","hints":[]},{"id":"L2-8","eu":"Agur David.","es":"Adios David","hints":[]},{"id":"L2-9","eu":"Agur.","es":"Adios","hints":[]},{"id":"L2-10","eu":"Kaixo, ni Ana naiz, eta zu, zu garraiolaria zara?","es":"Hola, yo soy Ana, y tú, ¿tú eres transportista?","hints":[]},{"id":"L2-11","eu":"Ez, ni ez naiz garraiolaria, ni postaria naiz.","es":"No, yo no soy transportista, yo soy cartero.","hints":["el cartero"]},{"id":"L2-12","eu":"Barkatu, zu Alfredo zara?","es":"Perdón, ¿tú eres Alfredo?","hints":["perdón"]},{"id":"L2-13","eu":"Bai, ni Alfredo naiz.","es":"Sí, yo soy Alfredo","hints":[]},{"id":"L2-14","eu":"agur Alfredo.","es":"Adios Alfredo","hints":[]},{"id":"L2-15","eu":"agur Ana.","es":"Adios Ana","hints":[]}],"extra":[{"id":"X2-1","eu":"Nor zara zu?","es":"¿Quien erés tú?","hints":[]},{"id":"X2-2","eu":"Nor da hura?","es":"¿Quien es él/ella?","hints":[]},{"id":"X2-3","eu":"Nortzuk dira haiek?","es":"¿Quienes son ellos/as?","hints":[]},{"id":"X2-4","eu":"Nortzuk zarete zuek?","es":"¿Quienes sois vosotros/as?","hints":[]},{"id":"X2-5","eu":"Nor da?","es":"¿Quien es?","hints":[]},{"id":"X2-6","eu":"Zu Pablo zara?","es":"¿tú erés Pablo?","hints":[]},{"id":"X2-7","eu":"Marta Bianakoa da?","es":"¿Marta es de Viana?","hints":[]},{"id":"X2-8","eu":"Zuek Labastidakoak zarete?","es":"¿vosotros/as sois de Labastida?","hints":[]},{"id":"X2-9","eu":"Ez naiz arrantzalea, ni okina naiz","es":"No soy pescador, yo soy panadero/a.","hints":[]},{"id":"X2-10","eu":"Hura ez da garraiolaria, hura dendaria da","es":"El/ella no es transportista, el/ella es tendero/a","hints":[]},{"id":"X2-11","eu":"Ni ez naiz Natalia, ni Nuria naiz","es":"Yo no soy Natalia, yo soy Nuria","hints":[]}]},{"n":3,"title":"Verbo \"estar\". EGON (non), -tzen egon","pages":[9,11],"blocks":[{"t":"p","x":"En euskara hay pocos verbos que se declinen como el IZAN, ya veremos luego el porqué, pero uno de esos pocos es el EGON (estar), además es muy usado, así que lo veremos;"},{"t":"table","rows":[["EGON","","CASTELLANO"],["ni\nzu\nhura\ngu\nzuek\nhaiek","NAGO\nZAUDE\nDAGO\nGAUDE\nZAUDETE\nDAUDE","yo estoy\ntú estás\nél/ella está\nnosotros/as estamos\nvosotros/as estais\nel/ella están"]]},{"t":"p","x":"Para indicar estancia en un lugar ponemos el atzizki -n si es en un sitio (BilboN->en Bilbo), o -etan si es en varios sitios (futbol zelaiETAN->en los campos de fútbol). Si el sitio acaba en consonante se pone -en (Paris->ParisEN, Madril (Madrid) -> MadrilEN)"},{"t":"p","x":"Unos ejemplos con este verbo pueden ser;"},{"t":"table","rows":[["EUSKARA","CASTELLANO"],["Non zaude?","¿Donde estás?"],["Azkoitian nago.","Estoy en Azkoitia."],["Non dago Nerbioi-Ibaizabal\nibaia?","¿Donde está el río Nervión-Ibaizabal?"],["Nerbioi-Ibaizabal Bilbon dago","El Nervión-Ibaizabal está en Bilbao"],["Non dago Wally?","¿Donde está Wally?"],["Wally ez dago.","Wally no está."],["non daude behiak?","¿Donde están las vacas?"],["Behiak mendietan daude.","Las vacas estan en las montañas."],["Non ostia zaudete?","¿Donde ostias estais?"],["Tragu bat harTZEN gaude.","Estamos tomaNDO un trago."],["Iruñan, tragu bat hartzen gaude.","Estamos en Iruña, tomando un trago."],["Iruñako Jarauta kalean tragu bat\nhartzen gaude","Estamos en la calle Jarauta de Iruña tomando un trago."],["kaixo, zer moduz zaude?","Hola, ¿qué tal estás?"],["ni ondo, eta zu?","Yo bien, ¿y tú?"],["ni ondo ere bai, agur","Yo bien también, adios."]]},{"t":"p","x":"En 3 ejemplos de los anteriores hemos descubierto el gerundio, si el infinitivo del diccionario es \"hartu\" (coger) hemos quitado el -tu, y hemos puesto el atzizki -tzen, construyendo así el gerundio. Más adelante veremos como este -tzen no solo sirve para el gerundio, sino que va a ser muy útil para diferenciar los tiempos verbales, aunque todavía no nos interese mucho, luego lo usaremos más. Reuniendo normas para añadir el atzizki de gerundio descubrimos que no son muchas;"},{"t":"table","rows":[["Terminación","ACCION","POR EJEMPLO=ADIBIDEZ"],["-tu","quitar -tu y poner -tzen","harTU->harTZEN,\nbegiraTU (mirar) ->begiraTZEN"],["-n","quitar -n y poner -ten","egoN->egoTEN\nizan->izaten\njan (comer)->jaten\nedan (veber)->edaten"],["-si","quitar -i y poner -ten","jausi (caer)->jausten\nikusi (ver)->ikusten"]]},{"t":"p","x":"En general en cuanto oigamos o leyamos cada verbo seguramente lo iremos memorizando."}],"ex":[{"id":"L3-1","eu":"Kaixo Rafa, non dago David?","es":"Hola Rafa, ¿donde está David?","hints":[]},{"id":"L3-2","eu":"Rafa Ansoainen dago, eta gu berriz Iruñean gaude.","es":"Rafa esta en Ansoain, y nosotros, en cambio, estamos en Iruñea","hints":["en cambio"]},{"id":"L3-3","eu":"Bai, gu Iruñean, Gaztelu Plazan paseatzen gaude","es":"Sí, nosotros en Iruñea, estamos paseando en la Plaza Castillo","hints":["pasear"]},{"id":"L3-4","eu":"non dago China?","es":"¿Donde está China?","hints":[]},{"id":"L3-5","eu":"China Asian dago.","es":"China está en Asia.","hints":[]},{"id":"L3-6","eu":"eta Roldan, non dago Roldan?","es":"Y Roldan, ¿Dónde está Roldan?","hints":[]},{"id":"L3-7","eu":"Roldan Laosen dago.","es":"Roldan está en Laos","hints":[]},{"id":"L3-8","eu":"non gaude?","es":"¿Dónde estamos?","hints":[]},{"id":"L3-9","eu":"Bilboko Kafe Antzokian gaude.","es":"Estamos en el Kafe Antzoki (Cafe Teatro) de Bilbao","hints":[]},{"id":"L3-10","eu":"Bilboko Kafe Antzokian gaude?","es":"¿Estamos en el Kafe Antzoki de Bilbao?","hints":[]},{"id":"L3-11","eu":"Ez, ez gaude Bilboko Kafe Antzokian, gu Bilboko Azkena pub-en gaude.","es":"No, no estamos en el Kafe antzoki de Bilbao, nosotros estamos en el pub Azkena de Bilbao","hints":[]},{"id":"L3-12","eu":"non zaude","es":"¿Dónde estás?","hints":[]},{"id":"L3-13","eu":"etxean nago.","es":"Estoy en casa","hints":[]},{"id":"L3-14","eu":"kalean zaude?","es":"¿Estás en la calles?","hints":["en la calle"]},{"id":"L3-15","eu":"ez, ez nago kalean, ni zinean nago.","es":"No, no estoy en la calle, yo estoy en el cine.","hints":["cine"]}],"extra":[{"id":"X3-1","eu":"Non zaude?","es":"¿Donde estás?","hints":[]},{"id":"X3-2","eu":"Azkoitian nago.","es":"Estoy en Azkoitia.","hints":[]},{"id":"X3-3","eu":"Non dago Nerbioi-Ibaizabal ibaia?","es":"¿Donde está el río Nervión-Ibaizabal?","hints":[]},{"id":"X3-4","eu":"Nerbioi-Ibaizabal Bilbon dago","es":"El Nervión-Ibaizabal está en Bilbao","hints":[]},{"id":"X3-5","eu":"Non dago Wally?","es":"¿Donde está Wally?","hints":[]},{"id":"X3-6","eu":"Wally ez dago.","es":"Wally no está.","hints":[]},{"id":"X3-7","eu":"non daude behiak?","es":"¿Donde están las vacas?","hints":[]},{"id":"X3-8","eu":"Behiak mendietan daude.","es":"Las vacas estan en las montañas.","hints":[]},{"id":"X3-9","eu":"Non ostia zaudete?","es":"¿Donde ostias estais?","hints":[]},{"id":"X3-10","eu":"Tragu bat harTZEN gaude.","es":"Estamos tomaNDO un trago.","hints":[]},{"id":"X3-11","eu":"Iruñan, tragu bat hartzen gaude.","es":"Estamos en Iruña, tomando un trago.","hints":[]},{"id":"X3-12","eu":"Iruñako Jarauta kalean tragu bat hartzen gaude","es":"Estamos en la calle Jarauta de Iruña tomando un trago.","hints":[]},{"id":"X3-13","eu":"kaixo, zer moduz zaude?","es":"Hola, ¿qué tal estás?","hints":[]},{"id":"X3-14","eu":"ni ondo, eta zu?","es":"Yo bien, ¿y tú?","hints":[]},{"id":"X3-15","eu":"ni ondo ere bai, agur","es":"Yo bien también, adios.","hints":[]}]},{"n":4,"title":"Verbo \"ir\" y \"venir\". JOAN (nora), -tzera; ETORRI (nondik), -tzetik","pages":[11,12],"blocks":[{"t":"p","x":"Otro de los poquísimos verbos que se conjugan es el JOAN (ir), el galdegaia es el NORA (a donde? para indicar a donde se pone el atzizki -ra (-era, si el sitio acaba en consonante, por tanto, tal y como sucedía con NON, Paris->ParisERA, Madril->MadrilERA), y -etara si es más de un sitio."},{"t":"table","rows":[["JOAN","","CASTELLANO"],["ni","NOA","yo voy"],["zu","ZOAZ","tú vas"],["hura","DOA","él/ella va"],["gu","GOAZ","nosotros/as vamos"],["zuek","ZOAZTE","vosotros/as vais"],["haiek","DOAZ","ellos/as van"]]},{"t":"p","x":"Ejemplos:"},{"t":"table","rows":[["EUSKARA","CASTELLANO"],["ni Bilbora noa.","Yo voy a Bilbao."],["nora goaz?","¿Dónde vamos?"],["Bianara goaz","Vamos a Viana"],["nora zoazte?","¿Dónde vais?"],["Iruñara goaz berriro.","Vamos a Iruña de nuevo/otra vez."],["Iruñara, tragu bat hartzera goaz","a Iruña, vamos a tomar un trago"],["Bilboko Alde Zarreko dendetara\nnoa","voy a las tiendas del Casco Viejo de Bilbao"],["amama ikustera noa","voy a ver a la abuela"]]},{"t":"p","x":"tragu bat harTZERA, significa \"a tomar un trago\", las reglas para construir asi la palabras es coger el -ten o -tzen de la lección anterior, quitarle la -n y ponerle el -ra, no tiene más secretos."},{"t":"p","x":"El último verbo que os conjugo es el ETORRI (venir), el galdegaia es el NONDIK, para indicar de donde se pone el atzizki -tik (-etik si el sitio acaba en consonante, Paris- >ParisETIK), y -etatik si es mas de un sitio (“mendiETATIK” significa “DE LOS montes”)."},{"t":"table","rows":[["EUSKARA","","CASTELLANO"],["ni","NATOR","yo vengo"],["zu","ZATOZ","tu vienes"],["hura","DATOR","el viene"],["gu","GATOZ","nosotros/as venimos"],["zuek","ZATOZTE","vosotros/as venis"],["haiek","DATOZ","ellos/ellas vienen"]]},{"t":"p","x":"Ejemplos;"},{"t":"table","rows":[["EUSKARA","CASTELLANO"],["ni Donostiatik nator","yo vengo de San Sebastian"],["nondik zatoz?","¿de donde vienes?"],["nondik datoz umeak?","¿de donde vienen los/as niños/as?"],["umeak Parisetik datoz","los/as niños/as vienen de Paris"],["nondik dator dirua?","¿de donde viene el dinero?"],["dirua bankuetatik dator","el dinero viene de los bancos"],["tragu bat hartzetik nator","vengo de tomar un trago"],["etxetik nator","vengo de casa"],["eskolatik dator","viene de la escuela"]]}],"ex":[{"id":"L4-1","eu":"kaixo Jose Miguel, nondik zatoz?","es":"Hola José Miguel, ¿de dónde vienes?","hints":[]},{"id":"L4-2","eu":"Tuteratik nator.","es":"Vengo de Tudela","hints":[]},{"id":"L4-3","eu":"eta nora zoaz?","es":"¿Y a dónde vas?","hints":[]},{"id":"L4-4","eu":"Portugaletera noa.","es":"Voy a Portugalete","hints":[]},{"id":"L4-5","eu":"nora zoaz orain?","es":"¿y a dónde vas ahora?","hints":["ahora"]},{"id":"L4-6","eu":"orain kalera noa, ama.","es":"Ahora voy a la calle, mama","hints":[]},{"id":"L4-7","eu":"eta nondik zatoz?","es":"¿y de dónde vienes?","hints":[]},{"id":"L4-8","eu":"komunetik nator, agur ama","es":"Vengo del servicio, adiós mama","hints":["komuna=vater/servicio"]},{"id":"L4-9","eu":"Jose Luis pelikula bat hartzera doa","es":"José Luis va a coger/tomar una película","hints":[]},{"id":"L4-10","eu":"Jose Luis pelikula bat hartzetik dator","es":"José Luis viene de coger/tomar una película","hints":[]}],"extra":[{"id":"X4-1","eu":"ni Bilbora noa.","es":"Yo voy a Bilbao.","hints":[]},{"id":"X4-2","eu":"nora goaz?","es":"¿Dónde vamos?","hints":[]},{"id":"X4-3","eu":"Bianara goaz","es":"Vamos a Viana","hints":[]},{"id":"X4-4","eu":"nora zoazte?","es":"¿Dónde vais?", ntxakurra","tu perro","ZUREA","el/la tuyo/a","ZUREAK","los/as tuyos/as"],["BERE katuak","sus gatos","BEREA","el/la suyo/a","BEREAK","los/as suyos/as"],["GURE\nliburua","nuestro\nlibro","GUREA","el/la\nnuestro/a","GUREAK","los/as\nnuestros/as"],["ZUEN\npaperrak","vuestros\npapeleS","ZUENA","el/la vuestro/a","ZUENAK","los/as\nvuestros/as"],["HAIEN\nkutxa","su caja\n(de ellos)","HAIENA","el/la suyo/a (de\nellos/as)","HAIENAK","los/as\nsuyos/as"]]},{"t":"p","x":"Nos parecen fáciles los posesivos, ya que si es MI \"algo\", ponemos NIRE \"algo\"; si es EL MIO ponemos una -A detrás (NIREA), y si es LOS MIOS (en plural), ponemos -AK detrás (NIREAK)."},{"t":"p","x":"Lo mismo para 1ª, 2ª y 3ª persona del singular y del plural, y como además el euskara no tiene genero (masculino, femenino) nos ponemos contentos porque resulta ser más fácil de lo que en principio nos parecía."},{"t":"p","x":"El galdegaia es NORENA (de quien), NORENAK (de quien) si preguntamos por varias cosas."},{"t":"p","x":"Si en vez de decir “el mio”, o “los tuyos”, o “los suyos”, queremos decir “los de Miguel”, o “los de Inma”, ponemos al nombre el atzizki -rena (-renak si son cosas plurales), y quitamos la “-r-” al atzizki (-ena) si el nombre acaba en consonante, o si el dueño de ese algo es plural."},{"t":"p","x":"Adibideak (ejemplos);"},{"t":"table","rows":[["EUSKARA","CASTELLANO"],["Jose Manuel nire kotxean dator","Jose Manuel viene en mi coche"],["nire aita lanean dago","Mi padre está en el trabajo."],["ba (pues) nirea etxean dago","pues el mío está en casa"],["gure liburuak lodiak dira","nuestros libros son gordos"]]},{"t":"table","rows":[["ba haienak ez dira lodiak","pues los suyos (de ellos) no son gordos"],["haienak argalak dira","los de ellos son delgados"],["gure maisua Gazteizetik dator","nuestro/a profesor/a viene de Vitoria"],["gurea Iruñatik dator","el/la nuestro/ viene de Iruña"],["gureak Bilbotik datos","los/as nuestros/as vienen de Bilbao"],["Norena da liburua?","¿de quien es el libro?"],[ el bere ondoRA doaz","Alex y Miguel vienen A su lado"]]},{"t":"table","rows":[["Haiek zubi azpiTIK datoz","Ellos/as vienen DE debajo del puente"],["Haiek zubi gaineRA doaz","Ellos/as van A encima del puente"],["Etxe aurreKO kotxea nirea da","El coche DE delante de la casa es mío"],["Taberna atzeKO furgoneta haiena da","La furgoneta DE detrás del bar es de ellos/as"]]},{"t":"p","x":"Hemos usado los atzizki's -ra y -tik para indicar procedencia y destino, también usado -ko para referirnos al lugar en que se encuentra algo (mahai gaineKO koadernoa); -koa para decir EL/LA DE \"algún sitio\" (mahai gaineKOA urdina da->EL DE encima de la mesa es azul); y-koak para LOS/LAS DE \"algún sitio\" (gure ondoKOAK lagunak dira->LOS/LAS DE al lado nuestro son amigos/as)."}],"ex":[{"id":"L6-1","eu":"Nortzuk dira zure ondokoak?","es":"¿Quiénes son los de tu lado?","hints":[]},{"id":"L6-2","eu":"Nire ondokoak Alex eta María dira.","es":"Los de mi lado son Alex y María","hints":[]},{"id":"L6-3","eu":"Non zaudete?","es":"¿Dónde estais?","hints":[]},{"id":"L6-4","eu":"Buckingham Palace aurrean gaude","es":"Estamos delante de Buckingham Palace","hints":[]},{"id":"L6-5","eu":"Zinean zaude?","es":"¿Estás en el cine?","hints":[]},{"id":"L6-6","eu":"ez, ondoko dendan nago","es":"No, estoy en la tienda de al lado","hints":[]}],"extra":[{"id":"X6-1","eu":"Aurrean","es":"Delante","hints":[]},{"id":"X6-2","eu":"Atzean","es":"Detrás","hints":[]},{"id":"X6-3","eu":"Gainean","es":"Encima","hints":[]},{"id":"X6-4","eu":"Azpian","es":"debajo","hints":[]},{"id":"X6-5","eu":"Ondoan","es":"al lado","hints":[]},{"id":"X6-6","eu":"Ezkerran","es":"a la izquierda","hints":["ezkerra=izquierda"]},{"id":"X6-7","eu":"Eskuinean","es":"a la derecha","hints":["eskuina=derecha"]},{"id":"X6-8","eu":"Katua mahai azpian dago","es":"El gato está debajo de la mesa El gato está bajo la mesa","hints":[]},{"id":"X6-9","eu":"txakurra mahai ondoan dago.","es":"El perro está al lado de la mesa.","hints":[]},{"id":"X6-10","eu": locks":[{"t":"p","x":"Los demostrativos en euskara son:"},{"t":"table","rows":[["EUSKARA","CASTELLANO"],["Hau","esto,este/a"],["Hori","eso,ese/a"],["Hura","aquello,aquel/lla"],["Hauek","estos/as"],["Horiek","esos/as"],["Haiek","aquellos/as"]]},{"t":"p","x":"Vemos que \"aquello\",\"aquel\", y \"aquella\" (hura) coincide con el pronombre personal \"él\", \"ella\" (hura), el \"hura\" se usa mas como pronombre personal (el/ella) que como demostrativo (aquel, aquello, aquella), no obstante, y aunque en poca medida, puede ser usado tambiém como demostrativo. Lo mismo ocurre con haiek."},{"t":"p","x":"Veamos algunos ejemplos:"},{"t":"table","rows":[["EUSKARA","CASTELLANO"],["-Zer da hau?","-¿qué es esto?"],["-Hau arkatz bat da","-esto es un lápiz"],["-Norena da arkatz hau?","-¿de quién es este lápiz?"]]},{"t":"table","rows":[["-Arkatz hau nirea da.","-este lápiz es mío"],["-ZER KOLOREKOA da jertse hau?","-¿DE QUE COLOR es este jersey?"],["-jertse hau oria da.","-Este jersey es amarillo."],["-eta praka horiek?","-¿Y esos pantalones?"],["-praka horiek urdinak dira.","-Esos pantalones son azules."],["-Nongoak dira mutil horiek?","-¿de donde son esos chicos?"],["-Mutil horiek Azagrakoak dira.","-Esos chicos son de Azagra."],["-Eta neska haiek, nongoak dira neska gazte\nhaiek?","-y aquellas chicas, ¿de donde son aquellas chicas\njovenes?"],["-Neska gazte horiek Ansoaingoak dira.","-aquellas chicas jovenes son de Ansoain."]]},{"t":"p","x":"Observamos que el plural lo lleva el demostrativo (mutil horiek), en euskara, a diferencia del castellano, no hay que poner plural en ambos (esoS chicoS ), por tanto en euskara nunca diriamos \"mutilAK horieK\". Lo mismo con \"neska gazte horiek\", que jamas sería \"neskaK gazteaK horieK\","}],"ex":[{"id":"L7-1","eu":"Norena da karpeta hau?","es":"¿De quién es esta carpeta?","hints":["carpeta"]},{"id":"L7-2","eu":"karpeta hau Davidena da.","es":"Esta carpeta es de David","hints":[]},{"id":"L7-3","eu":"Nor da neska hori?","es":"¿Quién es esa ch caes"],["jausTEN ARI zara","te ESTÁS cayeNDO"],["jausiKO zara","te caeRÁs"],["igo da","ha subido"],["igoTZEN da","sube"],["igoTZEN ARI da","ESTÁ subieNDO"],["igoKO da","subiRÁ"],["jeitsi gara","hemos bajado"],["jeisTEN gara","llegamos"],["jeisTEN ARI gara","ESTAMOS llegaNDO"],["jeitsiKO gara","llegaREmos"],["iritsi zarete","habeis llegado"],["irisTEN zarete","llegais"],["irisTEN ARI zarete","ESTAIS llegaNDO"],["iritsiKO zarete","llegareis"],["irten dira","han salido"],["irteTEN dira","salen"],["irteTEN ARI dira","ESTÁN salieNDO"],["irtenGO dira","saldRÁn"]]},{"t":"p","x":"La introduccion de -T(Z)EN ARI conforma el gerundio, y es mejor usar esta forma que la ya vista de -T(Z)EN EGON (en realidad esta última es incorrecta aunque puede oirse). Así preferiremos decir \"zorabiatzen ari naiz\" que \"zorabiatzen nago\"."},{"t":"p","x":"Para los verbos que admiten conjugación (ya vistos) no usamos -TEN+ izan, sino que los conjugamos. Por tanto en vez de decir \"joaten naiz\", conjugamos el JOAN y decimos \"noa\" (lo mismo para todas las personas en el JOAN, ETORRI y EGON)."},{"t":"p","x":"Encontramos que según la terminación de cada verbo se pone -TEN o -TZEN. Para conjugar el futuro añadimos -KO en todos los verbos, menos en los que acaban en -N, en los cuales añadimos - GO."},{"t":"p","x":"En los que acaban en -TU (zorabiaTU), o en -DU (konponDU=arreglar(se), quitamos -TU o -DU y ponemos -TZEN (zorabiaTZEN, konponTZEN)."},{"t":"p","x":"Los que acaban en -I (jausI, ikusI (ikusi=ver)), quitamos la -i y ponemos -TEN (jausTEN, ikusTEN)."},{"t":"p","x":"Como caso particular del anterior, tenemos los verbos acabados en -TSI o -TZI (jeiTSI, iriTSI, irenTZI (tragar), idaTZI (escribir)). En estos pasamos la S o Z delante, y ponemos - TEN, quedándonos -STEN o -ZTEN (jeiSTEN, iriSTEN, irenZTEN, idaZTEN)"},{"t":"p","x":"Si acaban en -N (irteN, egiN (hacer), joaN) quitamos la -N y pon mos -TEN (irteTEN, egiTEN, joaTEN)"},{"t":"p","x":"Cuadro resumen;"},{"t":"table","rows":[["AZKEN HIZKIA (última\nletra)","GEHITU\n(añadir)","ADIBIDEAK"],["-TU, -DU","-TZEN\n-KO","zorabiaTU-->zorabiaTZEN\nzorabituKO"],["","","konponDU-->konponTZEN\nkonponduKO"],["-I","-TEN\n-KO","jausI-->jausTEN\njausiKO"],["","","ikusI-->ikusTEN\nikusiKO"],["-TSI/-TZI","-TEN\n-KO","jeiTSI-->jeiSTEN\njeitsiKO"],["","","idaTZI-->idaZTEN\nidatziKO"],["-N","-TEN\n-GO","egiN-->egiTEN\neginGO"],["","","joaN-->joaTEN\njoanGO"]]},{"t":"p","x":"Poniendo delante del aditz laguntzaile un BA- hacemos un condicional (es como imponer un SI condicional). El BA- con verbos conjugables también puede valer, según la frase, como el YA del castellano (BAnago=ya estoy, BAnoa=ya voy, BAdago=ya está)."},{"t":"p","x":"Diciendo el verbo tal cual (sin aditz laguntzaile, ni sin atzizki construimos el imperativo, y este imperativo vale para segunda persona del singular y del plural."},{"t":"p","x":"Etorri!=¡ven!,¡venid! irentsi=¡traga!,¡tragalo!,¡tragalos!,¡tragala!,¡tragalas!,¡tragad!,¡tragadlo!,¡tragadlos!, ¡tragadla!,¡tragadlas! irten!=¡sal!, ¡salid!"},{"t":"p","x":"Adibideak;"},{"t":"table","rows":[["EUSKARA","CASTELLANO"],["-Zer egiten ari zara?","-¿Qué estás haciendo?"],["-dendara sarTZEN ARI naiz","-ESTOY entraNDO a la tienda."],["-Atarrabiara joango naiz","-Iré a Villaba."],["-Atarrabiara BAzoaz, ni Falcesera joango\nnaiz.","-SI vas a Villaba, yo iré a Falces"],["-zorabiatzen BAzara, ni ez naiz joango.","-SI te mareas, yo no iré"],["-zorabiatu BAzara, ni ez naiz joango","-SI te has mareado, yo no iré"],["-non egon zara?","-¿donde has estado?"],["-San Adrianen egon naiz.","-he estado en San Adrian"]]},{"t":"table","rows":[["-irentsi pilula!","-traga(d) la pastilla!."],["-irentsi pilulak!","-traga(d) las pastillas!"],["-etorri orain Bilbora!","-¡ven ahora a Bilbao!"],["-banago Bilbon.","-ya estoy en Bilbao."]]}],"ex":[{"id":"L10-1","eu":"Zer egiten ari zara?","es":"¿Qué estás haciendo?","hints":[]},{"id":"L10-2","eu":"Telebista ikusten ari naiz, eta zu?","es":"Estoy viendo la TV, ¿y tú?","hints":[]},{"id":"L10-3","eu":"ni Gorbeia mendia igotzen ari naiz.","es":"Yo estoy subiendo el monte Gorbea","hints":["el monte Gorbea"]},{"id":"L10-4","eu":"Murchantera iritsi naiz","es":"He subido a Murchante","hints":[]},{"id":"L10-5","eu":"ba ni Zentronikora joango naiz, eta gero Tuterara.","es":"Pues yo iré a Cintruenigo, y después a Tudela","hints":["pues","después"]},{"id":"L10-6","eu":"Norian zorabiatzen naiz, eta zu?","es":"Me mareo en la noria, ¿y tú?","hints":[]},{"id":"L10-7","eu":"ni ez naiz norian zorabiatzen, ni itsasontzian zorabiatzen naiz.","es":"Yo no me mareo en la noria, yo me mareo en el barco","hints":["en el barco"]}],"extra":[{"id":"X10-1","eu":"zorabiatu naiz","es":"me he mareado","hints":["pasado reciente"]},{"id":"X10-2","eu":"zorabiaTZEN naiz","es":"me mareo","hints":["presente simple"]},{"id":"X10-3","eu":"zorabiaTZEN ARI naiz","es":"me ESTOY mareaNDO","hints":["presente continuo"]},{"id":"X10-4","eu":"zorabiatuKO naiz","es":"me mareaRÉ","hints":["futuro"]},{"id":"X10-5","eu":"jausi zara","es":"te has caido","hints":[]},{"id":"X10-6","eu":"dendara sarTZEN ARI naiz","es":"ESTOY entraNDO a la tienda.","hints":[]},{"id":"X10-7","eu":"Atarrabiara joango naiz","es":"Iré a Villaba.","hints":[]},{"id":"X10-8","eu":"Atarrabiara BAzoaz, ni Falcesera joango naiz.","es":"SI vas a Villaba, yo iré a Falces","hints":[]},{"id":"X10-9","eu":"zorabiatzen BAzara, ni ez naiz joango.","es":"SI te mareas, yo no iré","hints":[]},{"id":"X10-10","eu":"zorabiatu BAzara, ni ez naiz joango","es":"SI te has mareado, yo no iré","hints":[]},{"id":"X10-11","eu":"non egon zara?","es":"¿donde has estado?","hints":[]},{"id":"X10-12","eu":"San Adrianen egon naiz.","es":"he estado en San Adrian","hints":[]},{"id":"X10-13","eu":"irentsi pilula!","es":"traga la pastilla!.","hints":["d"]},{"id":"X10-14","eu":"irentsi pilulak!","es":"traga las pastillas!","hints":["d"]},{"id":"X10-15","eu":"etorri orain Bilbora!","es":"¡ven ahora a Bilbao!","hints":[]},{"id":"X10-16","eu":"banago Bilbon.","es":"ya estoy en Bilbao.","hints":[]}]},{"n":11,"title":"UKAN orainaldia","pages":[26,28],"blocks":[{"t":"p","x":"Hasta ahora hemos conocido verbos a los que no le podemos preguntar \"¿qué?\" es decir no tienen lo que en castellano se llama objeto o complemento directo. Por ejemplo, \"zorabiatzen naiz\" (me mareo), no podemos preguntar \"¿QUÉ me mareo?\", y podemos contestar que no mareo nada, soy yo quien se marea (\"yo\" es el sujeto, que aunque omitido es implicito por el verbo). Lo mismo pasa con \"iritsi gara\", ¿QUÉ venimos?\", no venimos nada."},{"t":"p","x":"En las frases con complemento directo, podemos preguntar \"¿qué?\", por ejemplo \"veo el libro\", preguntamos \"¿qué vés?\", y podemos contestar \"veo el libro\", lo mismo si decimos \"lo veo\" o \"veo\", en estas, aunque el objeto directo está omitido podemos preguntar \"¿qué vés?\", y contestar \"veo algo\" (lo que quiera que vea)."},{"t":"p","x":"Estos verbos en los que podemos preguntar ¿qué? se llaman transitivos, y para conjugarlos no usaremos el IZAN, sino que usaremos el UKAN, y para indicar los pronombres personales (el sujeto de la oración) añadiremos -K en singular, o sustituiremos -AK al final por -EK en plural."},{"t":"p","x":"En el objeto directo distinguiremos entre singular y plural (yo veo el libro, yo veo los libros)"},{"t":"table","rows":[["UKAN","","",""],["","","SINGULARRA","PLURALA"],["ni","NIK","dut","Ditut"],["zu","ZUK","duzu","Dituzu"],["hura","HARK","du","Ditu"],["gu","GUK","dugu","Ditugu"],["zuek","ZUEK","duzue","Dituzue"],["haiek","HAIEK","dute","Dituzte"]]},{"t":"p","x":"Como esquema de comstrucción morfológica podemos hacer;"},{"t":"table","rows":[["nik\nzuk\nhark\nguk\nzuek\nhaiek","D(IT)U","T\nZU\n----\nGU\nZUE\nTE","Ponemos -IT- si el objeto es plural, la única\nexcepción para esta tabla es \"haiek dituZte\"."]]},{"t":"p","x":"La forma de conjugar los verbos transitivos (con objeto) es como la de los intransitivos (sin objeto), con la única excepción del presente continuo (-T(Z)EN ARI), en los cuales seguiremos usando el IZAN, por eso en la lección anterior hemos podido preguntar \"zer egiten ari zara?\" (¿qué estás haciendo?), pero no podiamos preguntar \"¿qué haces?\"."},{"t":"table","rows":[["EUSKARA","CASTELLANO"],["nik egin dut","yo (lo) he hecho"],["nik egin dut ohea","yo he hecho la cama"],["nik egin ditut","yo (los) he hecho"],["nik egiTEN dut","yo (lo) hago"],["nik egiTEN ditut","yo (los) hago"],["nik egiTEN ARI naiz","yo lo estoy hacieNDO\nyo los estoy haciendo"],["nik eginGO dut","yo lo haRÉ"],["nik eginGO ditut","yo los haré"],["zuk kotxeAK ikusi dITuzu","tú has visto LOS cocheS"],["erlojua ekarri dut","he traido el reloj"],["haiek telebista ikusiko dute","Ellos verán la tele"],["haiek telebista ikusten ari dira","Ellos están viendo la tele"],["haiek telebista begiratu dute","Ellos han mirado la tele"],["haiek irratia entzun dute","Ellos han oido la radio"],["JuanEK liburuak ekarri ditu","Juan ha traido los libros"],["MartaK liburuak ekarri ditu","Marta ha traido los libros"]]},{"t":"table","rows":[["JuanEK eta MartaK ekarri\ndituzte","Juan y Marta los han traido"],["Aljebra ikasiko dugu","Estudiaremos algebra"],["Zuek irakurtzen duzue","Vosotros/as (los) leeis"],["zuek idazlana idatziko duzue","vosotros escribireis el \"trabajo escrito\" (idazlana)"],["Liburua ikusi (al) duzu?","¿has visto el libro?"],["irakurtzen baduzu, joango naiz","si lo lees, iré"],["garajean SARTU NAIZ","HE ENTRADO (YO) en el garage"],["KOTXEA garajean SARTU\nDUT","HE METIDO EL COCHE (¿qué he metido?-->el coche) en el\ngaraje"],["zorabiatu ZARA","TE has mareado (TÚ)"],["KARPETA zorabiatu DUZU","has mareado LA CARPETA (¿QUÉ has mareado?-->la carpeta)"],["TXAKURRA zorabiatu DUZU","has mareado EL PERRO (¿QUÉ has mareado?-->el perro)"],["TXAKURRAK zorabitu\nDITUZU","has mareado LOS PERROS (¿QUÉ has mareado?-->los perros)"],["JOSE zorabiatu DUZU","has mareado a JOSE (¿QUÉ/QUIEN has mareado?-->a Jose)"],["Zuk JOSE zorabiatu\nDUZU","tú has mareado a JOSE\n(¿QUÉ/QUIEN has mareado?->a Jose)\n(¿QUIEN ha mareado a Jose?-->tú (zuK) (sujeto))"],["JoseK kotxean CD-a\nekarri du","JOSE ha traido EL CD en el coche\n(¿QUÉ/QUIEN ha traido Jose?)"],["JoseK kotxean\nMIGUEL ekarri du","JOSE ha traido a MIGUEL en el coche\n(¿QUÉ/IEN ha traido Jose?)"]]},{"t":"p","x":"En castellano cuando en vez de algo, el objeto directo es alguien en castellano ponemos \"a\" delante del nombre, esto no ha de confundirnos, y tendremos que difrenciar el sujeto (Miguel) del objeto directo(Jose o José, ambos valen en castellano)."}],"ex":[{"id":"L11-1","eu":"kirola egiten duzu?","es":"¿Haces deporte?","hints":["deporte"]},{"id":"L11-2","eu":"ez, ez dut kirola egiten, eta zuk?","es":"No, no hago deporte, ¿y tú?","hints":[]},{"id":"L11-3","eu":"nik bai, nik kirola egiten dut.","es":"Yo sé, yo hago deporte","hints":[]},{"id":"L11-4","eu":"Egunkaria erosiko duzu?","es":"¿Comprarás el periódico?","hints":["el periódico","erosi=comprar"]},{"id":"L11-5","eu":"bai, erosiko dut.","es":"Sí, lo compraré","hints":[]},{"id":"L11-6","eu":"ze egunkaria erosten duzu?","es":"¿Qué periódico compras?","hints":[]},{"id":"L11-7","eu":"edozein erosten dut","es":"Compro cualquiera","hints":["cualquiera"]},{"id":"L11-8","eu":"pesetetan ordaintzen duzu?","es":"¿Pagas en pesetas?","hints":["ordaindu=pagar"]},{"id":"L11-9","eu":"ez, eurotan ordaintzen dut.","es":"No, pago en euros.","hints":[]}],"extra":[{"id":"X11-1","eu":"nik egin dut","es":"yo he hecho","hints":["lo"]},{"id":"X11-2","eu":"nik egin dut ohea","es":"yo he hecho la cama","hints":[]},{"id":"X11-3","eu":"nik egin ditut","es":"yo he hecho","hints":["los"]},{"id":"X11-4","eu":"nik egiTEN dut","es":"yo hago","hints":["lo"]},{"id":"X11-5","eu":"nik egiTEN ditut","es":"yo hago","hints":["los"]},{"id":"X11-6","eu":"nik egiTEN ARI naiz","es":"yo lo estoy hacieNDO yo los estoy haciendo","hints":[]},{"id":"X11-7","eu":"nik eginGO dut","es":"yo lo haRÉ","hints":[]},{"id":"X11-8","eu":"nik eginGO ditut","es":"yo los haré"  DUZU","es":"has mareado a JOSE","hints":["¿QUÉ/QUIEN has mareado?-->a Jose"]},{"id":"X11-30","eu":"Zuk JOSE zorabiatu DUZU","es":"tú has mareado a JOSE","hints":["¿QUÉ/QUIEN has mareado?->a Jose","zuK","sujeto","¿QUIEN ha mareado a Jose?-->tú"]},{"id":"X11-31","eu":"JoseK kotxean CD-a ekarri du","es":"JOSE ha traido EL CD en el coche","hints":["¿QUÉ/QUIEN ha traido Jose?"]},{"id":"X11-32","eu":"JoseK kotxean MIGUEL ekarri du","es":"JOSE ha traido a MIGUEL en el coche","hints":["¿QUÉ/IEN ha traido Jose?"]}]},{"n":12,"title":"EDUKI, JAKIN (presente)","pages":[28,30],"blocks":[{"t":"p","x":"Anteriormente hemos conjugado algunos verbos intransitivos (EGON, ETORRI eta JOAN). Esto también se puede hacer con algunos transitivos, de ellos el más importante es el EDUKI (tener)."},{"t":"table","rows":[["EUSKARA","","","CASTELLANO"],["NORK","SINGULARRA","PLURALA",""],["nik","daukat","dauzkat","yo (lo/a, los/as) tengo"],["zuk","daukazu","dauzkazu","tú (lo/a, los/as) tienes"],["hark","dauka","dauzka","él/ella (lo/a, los/as) tiene"],["guk","daukagu","dauzkagu","nosotros/as (lo/a, los/as) tenemos"],["zuek","daukazue","dauzkazue","vosotros/as (lo/a, los/as) teneis"],["haiek","daukate","dauzkate","ellos/as (lo/a, los/as) tienen"]]},{"t":"p","x":"Otro verbo importante es el JAKIN (saber);"},{"t":"table","rows":[["EUSKARA","","","CASTELLANO"],["NORK","SINGULARRA","PLURALA",""],["nik","dakit","dakizkit","yo (lo/a, los/as) sé"],["zuk","dakizu","dakizkizu","tú (lo/a, los/as) sabes"],["hark","daki","dakizki","él/ella (lo/a, los/as) sabe"],["guk","dakigu","dakizkigu","nosotros/as (lo/a, los/as) sabemos"],["zuek","dakizue","dakizkizue","vosotros/as (lo/a, los/as) sabeis"],["haiek","dakite","dakizkite","ellos/as (lo/a, los/as) saben"]]},{"t":"p","x":"Las tablas resumen son;"},{"t":"table","rows":[["EDUKI:","","","","JAKIN:","",""],["nik\nzuk\nhark\nguk\nzuek\nhaiek","DAU(Z)KA","T\nZU\n---\nGU\nZUE\nTE","","nik\nzuk\nhark\nguk\nzuek\nhaiek","DAKI(ZKI)","T\nZU\n---\nGU\nZUE\nTE"]]},{"t":"p"," k":"order","a":"Esan zuen pozik zegoela.","toks":["zegoela","esan","pozik","zuen"]}],"ex":[{"x":1,"inst":"Lee el texto y responde.","sec":"Lectura","notes":[]},{"x":2,"inst":"Verdadero o falso.","sec":"Lectura","notes":[]},{"x":3,"inst":"Elige la forma correcta del discurso referido.","sec":"Gramática y vocabulario","notes":[]},{"x":4,"inst":"Completa con la forma correcta del verbo en discurso referido.","sec":"Gramática y vocabulario","notes":[]},{"x":5,"inst":"Relaciona cada frase directa con su forma indirecta.","sec":"Gramática y vocabulario","notes":[]},{"x":6,"inst":"Ordena las palabras para formar frases en discurso referido.","sec":"Gramática y vocabulario","notes":[]}]},{"id":"B1-5","lvl":"B1","n":5,"title":"Repaso integrador B1","desc":"Repaso de pasado, condicional, opinión y discurso referido.","lessons":[29,30,34,38,39],"stop":41,"ctxs":["Asteburu luzea\nJoan den asteburuan hiru egun izan genituen libre, eta Nerearekin mendira joatea erabaki genuen. Larunbatean goizeko zazpietan irten ginen etxetik. Bidea luzea zirudien, baina paisaia ikusgarria zen. Eguerdian tontorrera iritsi ginen eta han bazkaldu genuen. Igandean, berriz, euria egin zuen, eta etxean geratu ginen. Nereak esan zuen hurrengoan beste mendi bat probatuko dugula. Nik uste dut ideia ona dela, baina denbora gehiago beharko dugula prestatzeko."],"items":[{"id":"B1-5-1-1","x":1,"k":"mcq","a":1,"q":"Zenbat egun izan zituzten libre?","opts":["Bi","Hiru","Lau"],"c":0},{"id":"B1-5-1-2","x":1,"k":"mcq","a":0,"q":"Noiz irten ziren etxetik?","opts":["Larunbatean 7:00etan","Igandean 7:00etan","Larunbatean 8:00etan"],"c":0},{"id":"B1-5-1-3","x":1,"k":"mcq","a":1,"q":"Non bazkaldu zuten?","opts":["Etxean","Tontorrean","Mendiko tabernan"],"c":0},{"id":"B1-5-1-4","x":1,"k":"mcq","a":1,"q":"Zer egin zuten igandean?","opts":["Mendira joan ziren","Etxean geratu ziren","Zinemara joan ziren"],"c":0},{"id":"B1-5-1-5","x":1,"k":"mcq","a":0,"q":"Zer esan zuen Nereak?","opts":["Hurrengo beste mendi bat probatuko <script>
(function(){
"use strict";
const LES = COURSE.lessons;
const BYN = {}; LES.forEach(l=>{BYN[l.n]=l; l.title=l.title.replace(/\.\s*$/,"");});
const GROUPS=[[1,9,"Primeros pasos"],[10,19,"Presente"],[20,29,"Pasado"],[30,41,"Estructuras avanzadas"]];
const ITEM = {}; LES.forEach(l=>{l.ex.forEach(e=>{e.n=l.n;e.src="libro";ITEM[e.id]=e;});(l.extra||[]).forEach(e=>{e.n=l.n;e.src="extra";ITEM[e.id]=e;});});

/* ---------- refuerzo (ejercicios por niveles) ---------- */
const RB={},STOPS={},BLOCKS=[];
REFUERZO.levels.forEach(L=>L.blocks.forEach(b=>{
  RB[b.id]=b; BLOCKS.push(b); (STOPS[b.stop]=STOPS[b.stop]||[]).push(b.id);
  const exm={}; b.ex.forEach(x=>{exm[x.x]=x;});
  b.items.forEach(e=>{ const x=exm[e.x]||{}; e.b=b.id; e.src="ref"; e.lvl=b.lvl; e.inst=x.inst||""; e.notes=x.notes||[]; e.sec=x.sec||""; if(e.c!=null) e.ctx=b.ctxs[e.c]; ITEM[e.id]=e; });
}));
const STOPLIST=Object.keys(STOPS).map(Number).sort((a,b)=>a-b);
const prevStop=n=>{let p=0; STOPLIST.forEach(x=>{if(x<n)p=x;}); return p;};

/* ---------- almacenamiento ---------- */
const KEY="euskera.progreso.v1";
let mem=null;
function loadP(){ try{ const s=localStorage.getItem(KEY); if(s) return JSON.parse(s);}catch(e){} return mem||{items:{},theme:"auto",fs:1,last:null}; }
const P=loadP(); P.items=P.items||{}; P.fs=P.fs||1; P.hid=P.hid||{};
function saveP(){ mem=P; try{ localStorage.setItem(KEY,JSON.stringify(P)); }catch(e){} }
function applyPrefs(){
  const r=document.documentElement;
  if(P.theme==="light"||P.theme==="dark") r.setAttribute("data-theme",P.theme); else r.removeAttribute("data-theme");
  r.style.setProperty("--fsm",P.fs);
}
applyPrefs();

/* ---------- utilidades ---------- */
const $app=document.getElementById("app");
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const rich=s=>esc(s).replace(/([a-zñáéíóú]{2,})([A-ZÑ]{1,6})(?![A-Za-zñ])/g,'$1<b class="sf">$2</b>');
function norm(s){
  return String(s).toLowerCase().replace(/ñ/g,"\u0001").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\u0001/g,"ñ")
    .replace(/[¿?¡!.,;:"“”«»()\[\]…—–\-'’]/g," ").replace(/\s+/g," ").trim();
}
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++){ c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); } p=c; }
  return p[n];
}
const sim=(a,b)=>{const L=Math.max(a.length,b.length); return L?1-lev(a,b)/L:1;};
function jacc(a,b){ const A=new Set(a.split(" ")),B=new Set(b.split(" ")); let i=0; A.forEach(x=>{if(B.has(x))i++;}); return i/(new Set([...A,...B]).size||1); }
function variants(t){
  let outs=[[]];
  t.split(/\s+/).forEach(w=>{
    if(/[A-Za-zÁÉÍÓÚáéíóúñÑ]\/[A-Za-zÁÉÍÓÚáéíóúñÑ]/.test(w)){
      const parts=w.split("/").filter(Boolean); const first=parts[0];
      const opts=parts.map((p,i)=>i>0&&p.length<=2?first:p);
      const next=[]; outs.forEach(o=>new Set(opts).forEach(p=>next.push(o.concat(p)))); outs=next.slice(0,24);
    } else outs=outs.map(o=>o.concat(w));
  });
  return outs.map(o=>o.join(" "));
}
function gradeEu(u,t){ const a=norm(u),b=norm(t); if(a===b) return "ok"; if(b.length>=4&&lev(a,b)<=1) return "near"; return "bad"; }
function gradeEs(u,t){
  const a=norm(u); if(!a) return "bad"; let best=0,bj=0;
  variants(t).forEach(v=>{const b=norm(v); best=Math.max(best,sim(a,b)); bj=Math.max(bj,jacc(a,b));});
  if(best>=0.88||bj>=0.85) return "ok"; if(best>=0.7||bj>=0.6) return "near"; return "bad";
}
function diffWords(user,target){
  const u=user.trim().split(/\s+/).filter(Boolean), t=target.trim().split(/\s+/).filter(Boolean);
  const un=u.map(norm), tn=t.map(norm), m=u.length, n=t.length;
  const d=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--) d[i][j]=un[i]===tn[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
  const uh=[],th=[]; let i=0,j=0;
  while(i<m&&j<n){ if(un[i]===tn[j]){uh.push(esc(u[i]));th.push(esc(t[j]));i++;j++;} else if(d[i+1][j]>=d[i][j+1]){uh.push('<span class="w-bad">'+esc(u[i])+'</span>');i++;} else {th.push('<span class="w-miss">'+esc(t[j])+'</span>');j++;} }
  while(i<m){uh.push('<span class="w-bad">'+esc(u[i++])+'</span>');}
  while(j<n){th.push('<span class="w-miss">'+esc(t[j++])+'</span>');}
  return {user:uh.join(" "),target:th.join(" ")};
}

const isFail=id=>!!(P.items[id]&&P.items[id].f);

function record(id,ok){
  const it=P.items[id]||(P.items[id]={s:0,c:0,w:0,f:false,t:0});
  const snap=JSON.stringify(it);
  if(ok){it.c++;it.s++; if(it.s>=2) it.f=false;} else {it.w++;it.s=0;it.f=true;}

function lessonStats(l){

function rangeText(a){ a=a.slice().sort((x,y)=>x-y); const out=[]; let i=0; while(i<a.length){ let j=i; while(j+1<a.length&&a[j+1]===a[j]+1) j++; if(j-i>=2) out.push(a[i]+"–"+a[j]); else for(let k=i;k<=j;k++) out.push(String(a[k])); i=j+1; } return out.join(", "); }

function tableHTML(rows){
  const cols=Math.max(...rows.map(r=>r.length));

  rows.forEach((r,i)=>{

    if(nonEmpty.length===1&&cols>1){ h+=`<tr><td class="sec" colspan="${cols}">${rich(nonEmpty[0]).replace(/\n/g,"<br>")}</td></tr>`; return; }

    let cells=r.map(c=>`<${tag}>${rich(c).replace(/\n/g,"<br>")}</${tag}>`).join("");

}

/* ---------- sesión de práctica ---------- */
function weighted(pool,size){
  pool=pool.filter(e=>!isHid(e.id));
  const sz=size||(pool.length<=12?pool.length:10);
  return pool.map(e=>({e,k:(isFail(e.id)?0:(P.items[e.id]?(isDone(e.id)?3:2):1))+Math.random()*.6})).sort((a,b)=>a.k-b.k).slice(0,sz).map(x=>x.e);
}
function pickItems(kind,n,x){
  let pool;
  if(kind==="libro") pool=BYN[n].ex; else if(kind==="extra") pool=BYN[n].extra||[];
  else if(kind==="fails") pool=BYN[n].ex.concat(BYN[n].extra||[]).filter(e=>isFail(e.id));
  else if(kind==="rblock") pool=RB[n].items;
  else if(kind==="rfails") pool=RB[n].items.filter(e=>isFail(e.id));
  else if(kind==="rex") return RB[n].items.filter(e=>e.x===x&&!isHid(e.id));
  else pool=allFails().map(id=>ITEM[id]);
  return weighted(pool);
}
function startSession(items,title,back,keep){
  const q=(keep?items:shuffle(items)).map(e=>{
    if(e.k) return {e,type:"r_"+e.k};
    const toks=e.eu.split(/\s+/).filter(Boolean);
    const types=toks.length>=3&&toks.length<=12?["order","es2eu","eu2es"]:["es2eu","eu2es"];
    return {e,type:types[Math.floor(Math.random()*types.length)]};
  });
  S.sess={q,i:0,res:[],phase:"ask",title,back,bid:S.b,cur:null};
  prepQ(); go("session",null);
}
function prepQ(){
  const s=S.sess,it=s.q[s.i],e=it.e; s.phase="ask"; s.fb=null; s.hint=false; s.sel=null;
  if(it.type==="order"||it.type==="r_order"){ const toks=it.type==="r_order"?e.toks.slice():e.eu.split(/\s+/).filter(Boolean); let sh=shuffle(toks.map((t,i)=>({t,i}))); let tries=0; while(tries++<8&&sh.every((x,i)=>x.i===i)) sh=shuffle(sh); s.bank=sh; s.chosen=[]; }
  if(it.type==="r_mcq") s.opts=shuffle(e.opts.map((t,i)=>({t,i})));
  if(it.type==="r_tf") s.opts=[{t:"Verdadero",i:1},{t:"Falso",i:0}];
}

function passageHTML(t){
